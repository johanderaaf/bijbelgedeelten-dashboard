<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bepreekte Bijbelgedeelten | Dashboard</title><style>
:root{font-family:system-ui,'Segoe UI',Arial,sans-serif;color:#17362d;background:#f4f7f4}*{box-sizing:border-box}body{margin:0}header{background:#173f35;color:white;padding:27px max(18px,calc((100vw - 1140px)/2))}h1{font-size:clamp(25px,4vw,37px);margin:0}header p{margin:7px 0;color:#cde6da}main{max-width:1140px;margin:auto;padding:20px 15px 60px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:white;border:1px solid #dbe5de;border-radius:15px;padding:17px}.stat strong{display:block;font-size:clamp(22px,3vw,33px)}.stat span,.muted{color:#64786c;font-size:13px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.bar button,.bar input{border:1px solid #cbd9d0;background:white;color:#17362d;border-radius:9px;padding:11px;font:inherit}.bar button{cursor:pointer}.bar button.active{background:#173f35;color:white}.bar input{flex:1;min-width:180px}.legend{display:flex;gap:16px;flex-wrap:wrap;margin:15px 0;color:#5c7167;font-size:13px}.dot{display:inline-block;width:13px;height:13px;border-radius:3px;background:#fff;border:1px solid #d9e4dc;margin-right:5px;vertical-align:-2px}.recent{background:#27815a!important}.mid{background:#8dcca2!important}.old{background:#d5eadb!important}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px}.ps{background:white;border:1px solid #dbe5de;border-radius:12px;padding:14px;cursor:pointer;text-align:left;color:inherit;font:inherit}.ps:hover,.ps:focus-visible{outline:2px solid #27815a}.ps h3{margin:0 0 9px;font-size:16px}.ps small{color:#64786c}.track{height:8px;border-radius:10px;background:#e5ebe7;overflow:hidden;margin:10px 0}.fill{height:100%;background:#27815a}.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:7px;margin-top:15px}.cell{border:1px solid #d9e4dc;background:white;border-radius:6px;min-height:39px;display:grid;place-items:center;font:inherit;font-size:13px;color:#17362d;cursor:pointer}.cell.recent{color:white}.cell:focus-visible{outline:3px solid #f5a623}.panel{margin-bottom:20px}.panel h2{margin:0 0 6px}.back{border:0;background:none;text-decoration:underline;color:#173f35;padding:0;cursor:pointer;margin-bottom:13px}.detail{margin-top:15px;color:#52685c;font-size:14px;line-height:1.6}.detail strong{color:#17362d}.hidden{display:none}footer{margin-top:30px;color:#60746a;font-size:12px}.error{background:#fff1ed;padding:15px;border-radius:10px;color:#8a3225}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}.bar button{flex:1}}
</style></head><body><header><h1>Bepreekte Bijbelgedeelten</h1><p>Overzicht per Bijbelboek en hoofdstuk · Boskoop</p></header><main><section class="stats" id="stats"></section><div class="legend"><span><i class="dot recent"></i>Afgelopen 12 maanden</span><span><i class="dot mid"></i>1–2 jaar geleden</span><span><i class="dot old"></i>Langer dan 2 jaar</span><span><i class="dot"></i>Nog niet bepreekt</span></div><section id="overview"><div class="bar"><button class="active" data-filter="all">Alle boeken</button><button data-filter="OT">Oude Testament</button><button data-filter="NT">Nieuwe Testament</button><input id="search" type="search" placeholder="Zoek een Bijbelboek…" aria-label="Zoek een Bijbelboek"></div><div class="grid" id="grid"></div></section><section id="bookDetail" class="panel hidden"><button class="back" id="back">← Terug naar Bijbelboeken</button><h2 id="bookTitle"></h2><p class="muted" id="bookSummary"></p><div class="cells" id="chapters"></div><div class="detail" id="chapterDetail">Klik op een hoofdstuk voor de preekgegevens.</div></section><footer id="foot"></footer></main><script>
'use strict';let DATA,filter='all';const $=id=>document.getElementById(id),fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('nl-NL'):'—';function age(last){if(!last)return '';const d=new Date(last+'T12:00:00'),now=new Date(),y1=new Date(now),y2=new Date(now);y1.setFullYear(now.getFullYear()-1);y2.setFullYear(now.getFullYear()-2);return d>=y1?'recent':d>=y2?'mid':'old'}function stats(book){let x=DATA.preached[book.id]||{},arr=Object.values(x),last=arr.reduce((a,v)=>v.last>a?v.last:a,'');return {unique:arr.length,total:arr.reduce((n,v)=>n+v.count,0),last}}function renderStats(){let all=DATA.books.map(stats),chap=all.reduce((a,v)=>a+v.unique,0),max=DATA.books.reduce((a,b)=>a+b.chapters,0),preeks=all.reduce((a,v)=>a+v.total,0);$('stats').innerHTML=`<div class="stat"><strong>${DATA.books.length}</strong><span>Bijbelboeken</span></div><div class="stat"><strong>${chap} / ${max}</strong><span>Hoofdstukken bepreekt</span></div><div class="stat"><strong>${Math.round(100*chap/max)}%</strong><span>Hoofdstukdekking</span></div><div class="stat"><strong>${preeks}</strong><span>Bijbelpreekregistraties</span></div>`}function render(){const term=$('search').value.toLocaleLowerCase('nl');let books=DATA.books.filter(b=>(filter==='all'||b.testament===filter)&&b.name.toLocaleLowerCase('nl').includes(term));$('grid').innerHTML='';for(const b of books){let s=stats(b),pct=100*s.unique/b.chapters;let el=document.createElement('button');el.className='ps';el.innerHTML=`<h3></h3><small>${s.unique} van ${b.chapters} hoofdstukken · ${s.total} preken</small><div class="track"><div class="fill ${age(s.last)}" style="width:${pct}%"></div></div><small>Laatst bepreekt: ${fmt(s.last)}</small>`;el.querySelector('h3').textContent=b.name;el.onclick=()=>openBook(b);$('grid').append(el)}}function openBook(b){$('overview').classList.add('hidden');$('bookDetail').classList.remove('hidden');$('bookTitle').textContent=b.name;let s=stats(b);$('bookSummary').textContent=`${s.unique} van ${b.chapters} hoofdstukken bepreekt (${Math.round(s.unique/b.chapters*100)}%) · ${s.total} preken · Laatste: ${fmt(s.last)}`;$('chapters').innerHTML='';$('chapterDetail').textContent='Klik op een hoofdstuk voor de preekgegevens.';for(let i=1;i<=b.chapters;i++){const r=(DATA.preached[b.id]||{})[String(i)];let btn=document.createElement('button');btn.className='cell '+age(r?.last);btn.textContent=i;btn.title=`Hoofdstuk ${i}: ${r?r.count+' preekregistraties':'niet bepreekt'}`;btn.onclick=()=>{let target=$('chapterDetail');target.replaceChildren();let h=document.createElement('strong');h.textContent=b.name+' '+i;target.append(h,document.createElement('br'));if(!r){target.append(document.createTextNode('Nog niet bepreekt volgens de registraties.'));return}target.append(document.createTextNode(`${r.count} preekregistratie${r.count===1?'':'s'} · Laatst: ${fmt(r.last)}`));if(r.dates?.length){let line=document.createElement('div');line.textContent='Datums: '+r.dates.map(fmt).join(', ');target.append(line)}if(r.texts?.length){let line=document.createElement('div');line.textContent='Geregistreerde tekstverwijzingen: '+r.texts.join('; ');target.append(line)}};$('chapters').append(btn)}window.scrollTo({top:0,behavior:'smooth'})}$('back').onclick=()=>{$('bookDetail').classList.add('hidden');$('overview').classList.remove('hidden')};document.querySelectorAll('[data-filter]').forEach(btn=>btn.onclick=()=>{filter=btn.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===btn));render()});$('search').oninput=render;fetch('./data.json?cache='+Date.now()).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{DATA=d;renderStats();render();$('foot').textContent=`Bron: ${d.source||'Access-query Preken Boskoop'} · ${d.rows} registraties verwerkt. Hoofdstukdekking telt alleen Bijbelboeken; catechismus- en belijdenispreken vallen buiten dit overzicht.`}).catch(e=>{$('grid').innerHTML=`<p class="error">De gegevens konden niet worden geladen (${e.message}). Controleer of data.json naast index.html staat. Open de website via GitHub Pages of een lokale webserver.</p>`});
</script></body></html>
